services:
  db:
    image: postgres:12
    container_name: "bingo_db"
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: bingo_db
      POSTGRES_USER: bingo
      POSTGRES_PASSWORD: password
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready"
      interval: 10s
      timeout: 5s
      retries: 5

  api: # hasura
    build:
      context: .
      dockerfile: .docker/api.Dockerfile
    container_name: "bingo_api"
    ports:
      - "8080:8080"
    volumes:
      - ./api:/hasura/api
      - .:/hasura/project # プロジェクト全体をマウント（seedスクリプト用）
    env_file:
      - ./settings/bingo.env

  view-user:
    image: node:25-alpine
    container_name: "view-user"
    volumes:
      - ./view-user:/app
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    ports:
      - "3000:3000"
    env_file:
      - ./settings/bingo.env
    stdin_open: true
    tty: true

  view-admin:
    image: node:25-alpine
    container_name: "view-admin"
    volumes:
      - ./view-admin:/app
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    ports:
      - "3001:3000"
    env_file:
      - ./settings/admin.env
    stdin_open: true
    tty: true

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: nutfes-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./tmp/minio/data:/data
    command: "server /data --console-address :9001"
    env_file:
      - ./settings/admin.env

volumes:
  db-data:
