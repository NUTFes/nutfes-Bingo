version: "3.8"

services:
  db:
    image: postgres:12
    container_name: "bingo_db_prod"
    volumes:
      - db-prod-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: bingo_db
      POSTGRES_USER: bingo
      POSTGRES_PASSWORD: prod_password_change_me
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - bingo-network

  rustfs:
    image: rustfs/rustfs:latest
    container_name: nutfes-rustfs-prod
    ports:
      - "9000:9000"      # API port
      - "9001:9001"      # Console port
    volumes:
      - rustfs-prod-data:/data
    command: "rustfs /data"
    env_file:
      - ./settings/admin-prod.env
    environment:
      - RUSTFS_ROOT_USER=${MINIO_ROOT_USER}
      - RUSTFS_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - RUSTFS_ACCESS_KEY=${MINIO_ROOT_USER}
      - RUSTFS_SECRET_KEY=${MINIO_ROOT_PASSWORD}
    restart: unless-stopped
    networks:
      - bingo-network

  cloudflare:
    image: "cloudflare/cloudflared:latest"
    container_name: "cloudflare"
    volumes: ["./cloudflare/prod:/home/nonroot/.cloudflared"]
    command: tunnel run
    restart: unless-stopped
    depends_on:
      - view-user
      - view-admin
    networks:
      - bingo-network

  api: # hasura
    build:
      context: .
      dockerfile: .docker/api.Dockerfile
    container_name: "bingo_api"
    volumes:
      - ./api:/hasura/api
      - .:/hasura/project # プロジェクト全体をマウント（seedスクリプト用）
    env_file:
      - ./settings/bingo-prod.env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bingo-network

  view-user:
    image: node:18.17.0-alpine@sha256:58878e9e1ed3911bdd675d576331ed8838fc851607aed3bb91e25dfaffab3267
    container_name: "view-user"
    volumes:
      - ./view-user:/app
    working_dir: /app
    command: sh -c "npm install && npm run build && npm run start"
    ports:
      - "3000:3000"
    env_file:
      - ./settings/bingo-prod.env
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - bingo-network

  view-admin:
    image: node:18.17.0-alpine@sha256:58878e9e1ed3911bdd675d576331ed8838fc851607aed3bb91e25dfaffab3267
    container_name: "view-admin"
    volumes:
      - ./view-admin:/app
    working_dir: /app
    command: sh -c "npm install && npm run build && npm run start"
    ports:
      - "3001:3000"
    env_file:
      - ./settings/admin-prod.env
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - bingo-network

volumes:
  db-prod-data:
  rustfs-prod-data:

networks:
  bingo-network:
    driver: bridge
