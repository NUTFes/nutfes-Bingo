services:
  caddy:
    container_name: nutfes-bingo-caddy
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/caddy/pki/authorities/local/root.crt"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks:
      default:
        aliases:
          - nutfes-bingo.localhost
      supabase_network_nutfes-bingo:

  app:
    container_name: nutfes-bingo-dev
    image: nutfes-bingo-dev
    build:
      context: .
      dockerfile: dev.Dockerfile
    depends_on:
      caddy:
        condition: service_healthy
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      NODE_EXTRA_CA_CERTS: /caddy-data/caddy/pki/authorities/local/root.crt
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - caddy_data:/caddy-data:ro
    restart: unless-stopped
    networks:
      - default

volumes:
  node_modules:
  next_cache:
  caddy_data:
  caddy_config:

networks:
  supabase_network_nutfes-bingo:
    external: true
