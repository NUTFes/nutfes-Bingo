services:
  app:
    container_name: nutfes-bingo-dev
    image: nutfes-bingo-dev
    build:
      context: .
      dockerfile: dev.Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      SUPABASE_SERVER_URL: ${SUPABASE_SERVER_URL:-http://supabase_kong_nutfes-Bingo:8000}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY is required}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?SUPABASE_SECRET_KEY is required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-${SUPABASE_SECRET_KEY:?SUPABASE_SECRET_KEY is required}}
      NUTFES_PUBLIC_ACTION_HASH_SALT: ${NUTFES_PUBLIC_ACTION_HASH_SALT:-local-dev-public-action-salt}
      CI: "true"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/api/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks:
      - default
      - supabase_local

volumes:
  node_modules:
  next_cache:

networks:
  supabase_local:
    name: ${SUPABASE_DOCKER_NETWORK:-nutfes-bingo-dev}
    external: true
