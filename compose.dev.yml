services:
  caddy:
    container_name: nutfes-bingo-caddy
    image: caddy:2.11.4-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      NUTFES_DEV_SITE: ${NUTFES_DEV_SITE:-nutfes-bingo.localhost}
      SUPABASE_KONG_UPSTREAM: ${SUPABASE_KONG_UPSTREAM:-supabase_kong_nutfes-Bingo:8000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/caddy/pki/authorities/local/root.crt"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    networks:
      default:
        aliases:
          - nutfes-bingo.localhost
      supabase_local:

  app:
    container_name: nutfes-bingo-dev
    image: nutfes-bingo-dev
    build:
      context: .
      dockerfile: dev.Dockerfile
    depends_on:
      caddy:
        condition: service_healthy
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://nutfes-bingo.localhost}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://nutfes-bingo.localhost/supabase}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY is required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
      NUTFES_PUBLIC_ACTION_HASH_SALT: ${NUTFES_PUBLIC_ACTION_HASH_SALT:-local-dev-public-action-salt}
      NEXT_PUBLIC_ENABLE_ADMIN_SIGNUP: ${NEXT_PUBLIC_ENABLE_ADMIN_SIGNUP:-1}
      NODE_EXTRA_CA_CERTS: /caddy-data/caddy/pki/authorities/local/root.crt
      CI: "true"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      - caddy_data:/caddy-data:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/api/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks:
      - default

volumes:
  node_modules:
  next_cache:
  caddy_data:
  caddy_config:

networks:
  supabase_local:
    name: ${SUPABASE_DOCKER_NETWORK:-nutfes-bingo-dev}
    external: true
