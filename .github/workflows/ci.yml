name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.2.0"
  PNPM_VERSION: "11.2.2"

jobs:
  quality:
    name: Quality Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Takumi Guard
        uses: flatt-security/setup-takumi-guard-npm@8f53b50568e4466f2d92504f349c05b9ffcb8b59 # v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Oxfmt Check
        run: pnpm run fmt:check

      - name: Oxlint Check
        run: pnpm run lint

      - name: TypeScript Check
        run: pnpm exec tsc --noEmit

      - name: Docker Compose Config Check
        env:
          SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
          SUPABASE_SECRET_KEY: ci-secret-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
          CLOUDFLARE_TUNNEL_TOKEN: ci-cloudflare-token
        run: |
          docker compose -f compose.dev.yml config --quiet
          docker compose --env-file .env.production.example -f compose.prod.yml -f compose.cloudflare.yml config --quiet

      - name: Shell Script Syntax Check
        run: sh -n infra/scripts/*.sh

      - name: Production Preflight Check
        env:
          NUTFES_ALLOW_NON_LXC: "1"
        run: |
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT

          ./infra/scripts/init-production-env.sh "$tmpdir/.env.production"
          mkdir -p "$tmpdir/postgres" "$tmpdir/storage"
          sed -i \
            -e "s|^NEXT_PUBLIC_SITE_URL=.*|NEXT_PUBLIC_SITE_URL=https://app.example.test|" \
            -e "s|^SITE_URL=.*|SITE_URL=https://app.example.test|" \
            -e "s|^SUPABASE_SERVER_URL=.*|SUPABASE_SERVER_URL=http://kong:8000|" \
            -e "s|^SUPABASE_PUBLIC_URL=.*|SUPABASE_PUBLIC_URL=http://kong:8000|" \
            -e "s|^API_EXTERNAL_URL=.*|API_EXTERNAL_URL=http://kong:8000|" \
            -e "s|^ADDITIONAL_REDIRECT_URLS=.*|ADDITIONAL_REDIRECT_URLS=https://app.example.test/**|" \
            -e "s|^CLOUDFLARE_TUNNEL_TOKEN=.*|CLOUDFLARE_TUNNEL_TOKEN=ci-cloudflare-token|" \
            -e "s|^SUPABASE_DB_DATA_PATH=.*|SUPABASE_DB_DATA_PATH=$tmpdir/postgres|" \
            -e "s|^SUPABASE_STORAGE_DATA_PATH=.*|SUPABASE_STORAGE_DATA_PATH=$tmpdir/storage|" \
            "$tmpdir/.env.production"
          chmod 600 "$tmpdir/.env.production"

          ENV_FILE="$tmpdir/.env.production" ./infra/scripts/preflight.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Takumi Guard
        uses: flatt-security/setup-takumi-guard-npm@8f53b50568e4466f2d92504f349c05b9ffcb8b59 # v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build
        run: pnpm run build
