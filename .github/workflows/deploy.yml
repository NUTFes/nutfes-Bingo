name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

env:
  NODE_VERSION: "26.2.0"
  PNPM_VERSION: "11.2.2"

jobs:
  deploy:
    name: Deploy Worker, assets, and Durable Object migration
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify release
        run: pnpm check

      - name: Configure Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COOKIE_SIGNING_SECRET: ${{ secrets.COOKIE_SIGNING_SECRET }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
        run: |
          secrets_file="$RUNNER_TEMP/cloudflare-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n \
            --arg cookie "$COOKIE_SIGNING_SECRET" \
            --arg aud "$ACCESS_AUD" \
            --arg domain "$ACCESS_TEAM_DOMAIN" \
            '{COOKIE_SIGNING_SECRET: $cookie, ACCESS_AUD: $aud, ACCESS_TEAM_DOMAIN: $domain}' \
            > "$secrets_file"
          pnpm exec wrangler secret bulk "$secrets_file" --env production

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm build:production && pnpm exec wrangler deploy

      - name: Production smoke test
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          test -n "$PRODUCTION_URL"
          curl --fail --show-error --silent --retry 5 --retry-all-errors \
            "$PRODUCTION_URL/api/health" | jq -e '.ok == true'
