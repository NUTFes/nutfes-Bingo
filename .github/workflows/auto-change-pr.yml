name: Automatically labeling pull request

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  auto-change-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Label and assign pull request
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullRequest = context.payload.pull_request;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullRequest.number,
              per_page: 100,
            });

            const changedPaths = files.map((file) => file.filename);
            const labels = new Set();

            const pathMatches = (prefixes) =>
              changedPaths.some((path) => prefixes.some((prefix) => path.startsWith(prefix)));

            if (
              pathMatches([
                "public/",
                "src/app/",
                "src/components/",
                "src/features/",
                "src/styles/",
                "src/utils/i18n/",
              ])
            ) {
              labels.add("frontend");
            }

            if (
              pathMatches([
                "supabase/",
                "src/lib/auth/",
                "src/lib/supabase/",
                "src/features/admin/",
                "src/features/user/actions/",
              ])
            ) {
              labels.add("backend");
            }

            if (
              pathMatches([
                ".github/",
                "Caddyfile",
                "compose.",
                "dev.Dockerfile",
                "mise.toml",
                "package.json",
                "pnpm-lock.yaml",
              ])
            ) {
              labels.add("infra");
            }

            const branchType = pullRequest.head.ref.split("/")[0];
            const branchTypeToLabel = {
              feature: "enhancement",
              fix: "bug",
              hotfix: "bug",
            };
            const branchLabel = branchTypeToLabel[branchType];
            if (branchLabel) {
              labels.add(branchLabel);
            }

            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pullRequest.number,
                labels: [...labels],
              });
            }

            if (pullRequest.assignees.length === 0) {
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: pullRequest.number,
                assignees: [pullRequest.user.login],
              });
            }
