name: nutfes-bingo-prod

services:
  app:
    container_name: nutfes-bingo-app
    image: caddy:2-alpine
    depends_on:
      web:
        condition: service_healthy
    environment:
      EXTERNAL_SCHEME: ${EXTERNAL_SCHEME:-https}
      SUPABASE_UPSTREAM: ${SUPABASE_UPSTREAM:-supabase_kong_nutfes-Bingo:8000}
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_prod_data:/data
      - caddy_prod_config:/config
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks:
      default:
        aliases:
          - app
      supabase:

  web:
    container_name: nutfes-bingo-web
    image: nutfes-bingo-web:prod
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?set NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?set NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SERVER_URL: ${SUPABASE_SERVER_URL:-http://supabase_kong_nutfes-Bingo:8000}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?set SUPABASE_SECRET_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      ENABLE_ADMIN_SIGNUP: ${ENABLE_ADMIN_SIGNUP:-0}
      NUTFES_SKIP_SUPABASE_FETCH: ${NUTFES_SKIP_SUPABASE_FETCH:-0}
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    networks:
      default:
      supabase:

  cloudflared:
    container_name: nutfes-bingo-cloudflared
    image: cloudflare/cloudflared:2026.6.1
    command:
      ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/cloudflared_tunnel_token"]
    depends_on:
      app:
        condition: service_healthy
    secrets:
      - cloudflared_tunnel_token
    restart: unless-stopped
    networks:
      - default

secrets:
  cloudflared_tunnel_token:
    environment: CLOUDFLARED_TUNNEL_TOKEN

volumes:
  caddy_prod_data:
  caddy_prod_config:

networks:
  supabase:
    name: ${SUPABASE_DOCKER_NETWORK:-supabase_network_nutfes-Bingo}
    external: true
