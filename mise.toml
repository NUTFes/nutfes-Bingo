[tools]
node = "26.2.0"
pnpm = "11.2.2"

[tasks.install]
description = "Install dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Run the local Cloudflare Workers and Vite environment"
run = "pnpm dev"

[tasks.check]
description = "Run all static checks and tests"
run = "pnpm check"

[tasks.test]
description = "Run automated tests"
run = "pnpm test"

[tasks.build]
description = "Build the Worker and static assets"
run = "pnpm build"

[tasks.deploy]
description = "Build and deploy to Cloudflare"
run = "pnpm deploy"

[tasks.types]
description = "Generate Worker binding types"
run = "pnpm types"

[tasks."dev:reset"]
description = "Reset local Durable Object and R2 state"
run = "node scripts/reset-local.mjs"

[tasks."add"]
description = "Add dependency with pnpm (use -D for devDependency)"
usage = '''
arg "<package>" help="Package name to add"
flag "-D --dev" help="Add as devDependency"
'''
run = '''
if [ "${usage_dev:-false}" = "true" ]; then
  pnpm add -D "${usage_package?}"
else
  pnpm add "${usage_package?}"
fi
'''

[tasks."remove"]
description = "Remove dependency with pnpm"
usage = 'arg "<package>" help="Package name to remove"'
run = 'pnpm remove "${usage_package?}"'
